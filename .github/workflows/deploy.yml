name: Deploy to AWS EC2 — Lone Star Pediatrics

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'e2e/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  # ── Deploy API ────────────────────────────────────────────────────────────────
  # Deploys by having the server pull and rebuild its own git checkout at
  # /home/ec2-user/Pedipro-Forms, then restart the existing pm2 process in place.
  # This is the checkout pm2's "lsp-api" process actually runs from (confirmed via
  # `pm2 describe lsp-api` script path) and where the real production database
  # (apps/data/pediform.db) lives — NOT a separate /var/app tarball, which was
  # being built and shipped here on every push but never actually read by anything.
  # Secrets (JWT_SECRET, etc.) live in a persistent, manually-managed apps/api/.env
  # on the server and are intentionally left untouched by this job — `git reset
  # --hard` only affects tracked files, so that file survives every deploy.
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    steps:
      - name: Pull, build, and restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/Pedipro-Forms
            git fetch origin main
            git reset --hard origin/main
            cd apps/api
            npm install --include=dev
            npm run build
            DB_FILE="/home/ec2-user/Pedipro-Forms/apps/data/pediform.db"
            if command -v sqlite3 >/dev/null 2>&1 && [ -f "$DB_FILE" ]; then
              sqlite3 "$DB_FILE" "DELETE FROM pdf_template_fields WHERE template_id='3761fe08-1151-4f61-8411-75c78332ca2e'; DELETE FROM field_groups WHERE template_id='3761fe08-1151-4f61-8411-75c78332ca2e';"
              sqlite3 "$DB_FILE" "DELETE FROM pdf_template_fields WHERE template_id='d5dc70ff-7d29-4f74-9aea-c387eec9e6c4'; DELETE FROM field_groups WHERE template_id='d5dc70ff-7d29-4f74-9aea-c387eec9e6c4';"
            fi
            pm2 restart lsp-api
            pm2 save

  # ── Deploy Frontend ───────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build patient site
        working-directory: apps/web
        env:
          VITE_APP_MODE: patient
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          for i in 1 2 3; do npm install && break || { echo "npm install attempt $i failed, retrying…"; sleep 15; }; done
          npm run build
          mv dist dist-patient

      - name: Build admin site
        working-directory: apps/web
        env:
          VITE_APP_MODE: admin
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          npm run build
          mv dist dist-admin

      - name: Package frontend builds
        run: |
          tar -czf frontend.tar.gz -C apps/web dist-patient dist-admin

      - name: Copy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: frontend.tar.gz
          target: /home/ec2-user/

      - name: Deploy frontend files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/patient /var/www/admin
            sudo chown -R ec2-user:ec2-user /var/www/patient /var/www/admin
            tar -xzf /home/ec2-user/frontend.tar.gz -C /home/ec2-user/
            cp -r /home/ec2-user/dist-patient/. /var/www/patient/
            cp -r /home/ec2-user/dist-admin/. /var/www/admin/
            rm -rf /home/ec2-user/frontend.tar.gz /home/ec2-user/dist-patient /home/ec2-user/dist-admin
            sudo nginx -t && sudo systemctl reload nginx
